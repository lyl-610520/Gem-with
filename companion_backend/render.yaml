# Render部署配置文件 (最终版)
services:
  - type: web
    name: companion-backend
    env: python
    plan: free
    # 移除 rootDir 设置，我们从项目根目录开始操作
    buildCommand: pip install -r companion_backend/requirements.txt
    # 使用从根目录开始的、完整的模块路径来启动应用
    startCommand: gunicorn companion_backend.app:app
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: FLASK_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /api/health

databases:
  - name: companion-db
    plan: free
