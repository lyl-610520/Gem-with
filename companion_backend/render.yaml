# Render部署配置文件
services:
  - type: web
    name: companion-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false  # 需要在Render控制台中手动设置
      - key: FLASK_ENV
        value: production
    healthCheckPath: /api/health

databases:
  - name: companion-db
    plan: free